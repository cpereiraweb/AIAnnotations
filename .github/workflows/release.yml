name: Release

# A `v*` tag builds the installers on the 3 OSes and attaches them to a draft pre-release.
# A push to a `feat/release-*` branch, or a manual run, only builds them and keeps them as
# workflow artifacts, so they can be tested before a tag exists.
on:
  push:
    tags: ["v*"]
    branches: ["feat/release-*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an older glibc, so the .deb/.rpm also run on older distributions.
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: frontend dependencies
        run: npm --prefix ui ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The CLI the hooks call ships next to the app (bundle.externalBin).
      - name: CLI sidecar
        run: node scripts/prepare-sidecar.mjs ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx --prefix ui tauri
          args: --config crates/app/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: AIAnnotations ${{ github.ref_name }}
          releaseBody: Veja o CHANGELOG.md e o INSTALL.md. Versão beta, sem assinatura de código.
          releaseDraft: true
          prerelease: true
      - name: installers as artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
